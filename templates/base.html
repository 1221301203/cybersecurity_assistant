<!DOCTYPE html>
<html lang="{{ current_lang if current_lang else 'en' }}" dir="{{ t.get('dir', 'ltr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.get('app_title', 'CyberLearn') }}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#1e3a8a] via-[#1d4ed8] to-[#1e1b4b] text-white flex flex-col font-sans relative overflow-x-hidden">

    <!-- HEADER NAVIGATION BAR -->
    <header class="w-full bg-[#1e293b]/40 backdrop-blur-md border-b border-white/10 py-3.5 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-8 flex items-center justify-between">
            <!-- Logo + Name -->
            <a href="/" class="flex items-center gap-2 text-white font-medium text-sm hover:opacity-90 transition">
                <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                <span class="tracking-wide">CyberLearn</span>
            </a>

            <!-- Globe Icon & Language Selector -->
            <div class="relative flex items-center">
                <svg class="w-4 h-4 text-white/80 absolute left-2.5 pointer-events-none z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2h1.5a2.5 2.5 0 002.5-2.5V7a2 2 0 00-2-2h-1.5A2.5 2.5 0 0112 2.5v-.565M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                
                <select onchange="window.location.href = this.value;" class="bg-[#1e293b] border border-white/20 text-white text-xs rounded-lg pl-8 pr-7 py-1.5 focus:outline-none cursor-pointer appearance-none">
                    <option value="/set_language/en" class="bg-[#1e293b] text-white" {% if current_lang == 'en' or not current_lang %}selected{% endif %}>English</option>
                    <option value="/set_language/fr" class="bg-[#1e293b] text-white" {% if current_lang == 'fr' %}selected{% endif %}>Français</option>
                    <option value="/set_language/ar" class="bg-[#1e293b] text-white" {% if current_lang == 'ar' %}selected{% endif %}>العربية</option>
                </select>

                <svg class="w-3 h-3 text-white/70 absolute right-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- BACK BUTTON -->
    <div class="w-full max-w-7xl mx-auto px-8 pt-4">
        <!-- Back Button (Goes to Landing Page) -->
        <a href="{{ url_for('index') }}" class="inline-flex items-center gap-1.5 text-xs text-white/70 hover:text-white transition">
            <span>{% if current_lang == 'ar' %}→{% else %}←{% endif %}</span> {{ t.get('back', 'Back') }}
        </a>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow flex items-center justify-center px-4 py-6 z-10">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
